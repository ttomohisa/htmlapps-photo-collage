# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Validate PowerShell syntax and encoding
      shell: powershell
      run: .\scripts\check-powershell-syntax.ps1
    - name: Build and verify standalone HTML
      shell: pwsh
      run: |
        ./scripts/check-repository.ps1
        node --test tests/mobile-footer.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Footer source regression failed." }
    - name: Verify footer and Help in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-footer-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path test-results/mobile-footer | Out-Null
        node scripts/mobile-footer.browser.cjs 2>&1 | Tee-Object -FilePath test-results/mobile-footer/results.log
        if ($LASTEXITCODE -ne 0) { throw "Footer browser regression failed." }
        New-Item -ItemType Directory -Force -Path test-results/photo-collage-smoke | Out-Null
        node scripts/photo-collage-browser-smoke.cjs 2>&1 | Tee-Object -FilePath test-results/photo-collage-smoke/results.log
        if ($LASTEXITCODE -ne 0) { throw "Photo Collage browser smoke failed." }
        # One-time screenshot transfer; removed after the four images are committed.
        Write-Host "BK_PR_HEAD $((git rev-parse HEAD).Trim())"
        Write-Host "BK_PR_TREE $((git rev-parse 'HEAD^{tree}').Trim())"
        foreach ($image in @("screenshot.png", "screenshot-en.png", "screenshot-mobile.png", "screenshot-mobile-en.png")) {
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path "test-results/photo-collage-smoke" $image))
          $encoded = [Convert]::ToBase64String($bytes)
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 3000) {
            $count = [Math]::Min(3000, $encoded.Length - $offset)
            Write-Host "BK_IMAGE $image $offset $($encoded.Substring($offset, $count))"
          }
        }
    - name: Upload collage browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: photo-collage-browser-evidence
        path: test-results/photo-collage-smoke/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload footer browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-footer-browser-evidence
        path: test-results/mobile-footer/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
