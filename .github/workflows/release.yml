name: Tag and publish after main deployment

on:
  workflow_run:
    workflows:
      - Deploy standalone app to GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: photo-collage-release
  cancel-in-progress: false

jobs:
  release:
    # Only the validated main push may publish. PR builds cannot trigger this release.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact validated main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify commit and release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$VALIDATED_SHA" ]]; then
            echo "::notice::main advanced since this deployment; the newer push handles its own release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node -p "require('./app.config.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semantic version in app.config.json"
            exit 1
          fi
          tag="v$version"
          if ! grep -Fq "id=\"versionBadge\">$tag" photo-collage.html; then
            echo "::error::The committed single HTML and app version do not match"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download the verified standalone artifacts
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "standalone-html-$VALIDATED_SHA" --dir release-artifact
          test -s release-artifact/photo-collage.html
          test -s release-artifact/dist/index.self-extract.html
          cmp photo-collage.html release-artifact/photo-collage.html
          grep -Fq "connect-src 'none'" release-artifact/photo-collage.html

      - name: Create tag and GitHub Release once
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null || true)"
          if [[ -n "$ref_json" ]]; then
            target_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            object_type="$(jq -r '.object.type' <<< "$ref_json")"
            if [[ "$object_type" == "tag" ]]; then
              target_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target_sha" --jq '.object.sha')"
            fi
            if [[ "$target_sha" != "$VALIDATED_SHA" ]]; then
              echo "::error::$TAG already exists on a different commit; bump app.config.json version."
              exit 1
            fi
          else
            object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Photo Collage $TAG" -f object="$VALIDATED_SHA" -f type=commit --jq '.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object_sha" --silent
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$TAG" \
            "release-artifact/photo-collage.html#photo-collage.html" \
            "release-artifact/dist/index.self-extract.html#photo-collage.self-extract.html" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Photo Collage $TAG" \
            --generate-notes --verify-tag
