name: One-time Photo Collage screenshot refresh
on:
  push:
    branches:
      - fix/photo-collage-export-import-locale-20261119
    paths:
      - .github/workflows/screenshot-refresh-once.yml
permissions:
  contents: write
  actions: read
jobs:
  refresh:
    if: "github.event.head_commit.message == 'ci: run screenshot refresh once'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Retrieve screenshots from successful unprivileged Chromium run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14655907084/zip > "$RUNNER_TEMP/photo-collage-browser-evidence.zip"
      - name: Validate screenshots and copy four assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile
          root=Path('assets')
          expected={'screenshot.png':(1440,1120),
                    'screenshot-en.png':(1440,1120),
                    'screenshot-mobile.png':(390,844),
                    'screenshot-mobile-en.png':(390,844)}
          archive=Path('${{ runner.temp }}')/'photo-collage-browser-evidence.zip'
          with zipfile.ZipFile(archive) as z:
              for name,dims in expected.items():
                  infos=[entry for entry in z.infolist() if entry.filename == name]
                  if len(infos)!=1: raise RuntimeError(f'Missing or duplicated {name}')
                  data=z.read(infos[0])
                  if not (10000<len(data)<5_000_000): raise RuntimeError(f'Unexpected PNG size: {name}')
                  if data[:8]!=b'\x89PNG\r\n\x1a\n' or data[12:16]!=b'IHDR':
                      raise RuntimeError(f'Invalid PNG header: {name}')
                  if struct.unpack('>II',data[16:24])!=dims:
                      raise RuntimeError(f'Unexpected image dimensions: {name}')
                  (root/name).write_bytes(data)
                  print(f'Updated {name} ({len(data)} bytes)')
          PY
      - name: Commit screenshots to the existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png assets/screenshot-mobile-en.png
          if git diff --cached --quiet; then
            echo 'Screenshots are already current.'
            exit 0
          fi
          git commit -m "docs: refresh Photo Collage desktop and mobile screenshots"
          git push origin HEAD:"$GITHUB_REF_NAME"
